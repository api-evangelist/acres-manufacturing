notes: >-
  Acres publishes two first-party client SDKs — AcresBLE for iOS (a Swift package) and AcresBLE for
  Android (a Kotlin Android library) — and both are distributed as SOURCE from the acres4 GitHub
  organization only. Neither is on a package registry: Maven Central and npm return nothing for
  "acres"/"acres4", JitPack knows github.com/acres4/android-sdk but has never built a release, and
  the iOS package is consumed by pointing Swift Package Manager at the repository URL. Neither repo
  carries a single git tag or GitHub release, so there is no version a consumer can pin and no
  published date to read; both were last pushed 2026-08-18. That is the finding, recorded as
  version: null rather than guessed. There is no client library for the Foundation Event Replay
  API in any language — the provider's reference shows a raw WebSocket URL and notes that Acres
  tested it with an internal Go implementation that is not published.
