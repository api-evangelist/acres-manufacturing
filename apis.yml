aid: acres-manufacturing
name: Acres Manufacturing
description: >-
  Acres Manufacturing Company (also trading as Acres 4.0), of Las Vegas, Nevada, builds Foundation —
  a casino management system that connects directly to a slot machine's SAS port and streams every
  gaming-floor event in real time. Foundation carries the operator's cashless, bonusing, ticketing,
  loyalty and analytics products (FoundationHQ, Cashless Casino, Player Budget, Achievement Bonusing,
  Ticket In Bonus Out, Video Poker Analyzer, Guardian and Kai), and it is sold as an open platform:
  Acres publishes a Foundation App Store and gives third-party developers an event API onto the same
  floor data its own applications consume. The public developer surface is the Foundation Event
  Replay API — real-time and historical WebSocket streams of SAS 6.02 exception events, meter
  movements, machine info and player-card events, documented per version in the company's own
  acres4 GitHub organization — plus the AcresBLE iOS and Android SDKs, which let a partner mobile
  app card a player in and fund or cash out a slot or table over Bluetooth Low Energy. Foundation
  communication is TLS 1.3 and Acres states its APIs require mTLS for authentication.
