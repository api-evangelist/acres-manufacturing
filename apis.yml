apis:
- name: Foundation Event Replay API
  description: >-
    WebSocket streaming API onto the Foundation event bus. Two channels are documented: a real-time
    event streamer that pushes every event as it is collected from the floor (backed by a rolling
    cache of up to 10,000 events or 10 minutes, whichever is smaller, reachable with the start_idx
    filter), and a historical event streamer that replays a bounded window by nanosecond Unix
    timestamp or by global index. Both accept the same filter set as query parameters —
    sas_codes (SAS 6.02 Appendix A Table A-1 exception codes, decimal), asset_number,
    sas_serial_number, start_idx and limit — and both emit flattened JSON packets carrying a type,
    the EGM serial and asset number, the player card number and host player id, event and cache
    timestamps, a global idx ordering field, and per-packet data and meters maps. The host is
    per-property: <property> is the subdomain of the casino running Foundation, so the base URL is
    templated rather than a single vendor-operated endpoint. Requests that are not upgraded to a
    WebSocket are rejected with HTTP 400.
  humanURL: https://github.com/acres4/foundation-documentation/blob/master/apis/event/1.4/usage.md
  baseURL: wss://{property}.kailabor.com/nex7/sas-reader/ws
  x-baseurl-note: >-
    Templated per casino property, exactly as the provider documents it — <property> is the
    subdomain for the casino running Foundation (the docs' own example is mycasino.kailabor.com).
    kailabor.com resolves (AWS-hosted, Route 53 nameservers) but has no root site; there is no
    shared multi-tenant host to record and none was invented.
  tags:
