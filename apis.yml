- name: AcresBLE SDK (Bluetooth Low Energy)
  description: >-
    First-party Bluetooth Low Energy SDK, published for iOS (Swift package) and Android (Kotlin),
    that lets a technology partner's mobile app talk directly to Acres BLE hardware on the casino
    floor. Two controllers are documented: an electronic card-in controller that inserts and removes
    a player card at an EGM's player interface (writing the card track and reading the busy
    characteristic), and a slot-and-table controller that finds a device advertising the machine
    information service above -65 dBm, reads its SAS serial, and — for table games — funds a table,
    requests a dealer cash-out, and cancels a suggested cash-out. There is no HTTP surface here; the
    contract is the BLE GATT characteristics the SDK wraps, so no baseURL is recorded.
  humanURL: https://github.com/acres4/ios-sdk
