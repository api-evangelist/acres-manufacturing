certifications:
  published: false
  note: >-
    No trust center, SOC 2, ISO 27001 or PCI attestation is published on the Acres website. Gaming
    laboratory certification is implied by the MachineInfo packet carrying a GLIConfirmation field
    (a Gaming Laboratories International confirmation number reported by the host system), but that
    is a property's machine record, not an Acres certification, so no Compliance pointer is emitted.
