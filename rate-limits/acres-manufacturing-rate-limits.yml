summary: >-
  Acres publishes no per-key or per-account HTTP rate limit, no RateLimit-*/Retry-After headers and
  no 429 status. What it does publish — and this is real, usable runtime guidance — is a
  CLIENT-SPEED-DEPENDENT ceiling on the historical replay `limit` parameter, plus the size of the
  real-time replay cache. The constraint is throughput, not quota: a client that consumes packets
  too slowly silently misses packets rather than being throttled.
